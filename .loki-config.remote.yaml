auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096

common:
  instance_addr: 127.0.0.1
  path_prefix: /tmp/loki
  storage:
    filesystem:
      chunks_directory: /tmp/loki/chunks
      rules_directory: /tmp/loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

compactor:
  working_directory: /tmp/loki/compactor
  retention_enabled: true
  delete_request_store: filesystem # required by Loki 3.x when retention is enabled

limits_config:
  allow_structured_metadata: true
  retention_period: 720h # 30 days — compactor deletes older chunks (filesystem store)
  reject_old_samples: true
  reject_old_samples_max_age: 168h # Drops incoming logs older than 7 days
  creation_grace_period: 10m
