version: "3.8"

services:
  # Gonic - Subsonic-compatible music server
  gonic:
    image: sentriz/gonic:latest
    container_name: jukeplayer_gonic
    environment:
      - TZ=${TZ:-UTC}
      # optionally, see more available env vars in the readme
    ports:
      - "4747:80"
    networks:
      - unified_network
    
    volumes:
      - /home/pi/gonic/data:/data                    # gonic db etc
      - /mnt/music/collection:/music:ro              # your music collection
      - /home/pi/gonic/podcasts:/podcasts            # podcasts
      - /home/pi/gonic/playlists:/playlists          # playlists
      - /home/pi/gonic/tmp:/cache                    # transcode / covers / cache
    
    logging:
      driver: syslog
      options:
        syslog-address: "udp://192.168.68.102:514"
        tag: "GONIC"
        syslog-facility: "daemon"
        syslog-format: "rfc5424"
    
    # Uncomment if using jukebox with audio output on host
    #group_add:
    #  - audio
    #devices:
    #  - /dev/snd:/dev/snd
    
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # JukePlayer - MediaPlayer API for the jukebox
  jukeplayer:
    # OPTION A: Build locally (uncomment below)
    # build:
    #   context: .
    #   dockerfile: Dockerfile
    
    # OPTION B: Use pre-built image from GitHub Container Registry (uncomment below)
    image: ghcr.io/kaninfod/jukeplayer_backend/jukeplayer:latest
    
    container_name: jukeplayer_backend
    hostname: jukeplayer-backend

    environment:
      # --- container runtime plumbing (not app config) ---
      - PULSE_SERVER=unix:/run/user/1000/pulse/native
      - PULSE_COOKIE=/root/.config/pulse/cookie
      - TZ=${TZ:-UTC}
      # --- bootstrap keys only: everything else (Subsonic, speakers, MPV,
      #     server behaviour) lives in the config store (data/config.json),
      #     managed from the web UI. Full list: docs/OPERATIONS.md ---
      - DEBUG_MODE=${DEBUG_MODE:-false}
      - ENABLE_DOCS=${ENABLE_DOCS:-false}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - LOG_FILE=${LOG_FILE:-logs/jukebox.log}
      - LOG_SERVER_HOST=192.168.68.102
      - LOG_SERVER_PORT=514
      

    # ports:
    #   - "8001:8001"
    
    network_mode: "host"
    
    volumes:
      - /home/pi/jukeplayer/data/covers:/jukeplayer_backend/static_files/covers
      - /home/pi/jukeplayer/logs:/jukeplayer_backend/logs         # Application logs (rotated, 10MB x5)
      - /run/user/1000/pulse:/run/user/1000/pulse    # PulseAudio sockets for container audio
      - /home/pi/.config/pulse/cookie:/root/.config/pulse/cookie:ro # PulseAudio auth cookie
      - /run/dbus:/run/dbus                          # DBus mapping for bluez

    
    

    # Allow container to access hardware audio interfaces and dbus
    device_cgroup_rules:
      - 'c 116:* rwm'

    depends_on:
      gonic:
        condition: service_healthy

    # logging: deliberately removed — the app sends RFC3164 directly via its
    # own SysLogHandler (real PRI severity); the Docker syslog driver stamped
    # a fake severity and duplicated the transport (2026-09-16).

    restart: unless-stopped

networks:
  unified_network:
    external: true

# Optional: define volumes if using named volumes instead of host paths
# volumes:
#   gonic_data:
#   jukeplayer_data:
