<!-- Kiosk Media Controls (persistent bottom bar) — the volume pair is now a single button opening a vertical slider + mute popover -->
<div data-playercontrols-target="controlspanel" class="kiosk-controls d-flex justify-content-center align-items-center gap-3 p-2 ">
    
    <button data-action="click->playercontrols#previous" class="btn btn-primary btn-media-control" title="Previous Track">
        <i class="mdi mdi-skip-previous"></i>
    </button>
    <button data-action="click->playercontrols#playPause" class="btn btn-primary btn-media-control" title="Play/Pause">
        <i class="mdi mdi-play-pause"></i>
    </button>
    <button data-action="click->playercontrols#next" class="btn btn-primary btn-media-control" title="Next Track">
        <i class="mdi mdi-skip-next"></i>
    </button>
    <button data-action="click->playercontrols#stop" class="btn btn-primary btn-media-control" title="Stop">
        <i class="mdi mdi-stop"></i>
    </button>

    <!-- Volume popover: one button opens the vertical slider + mute flyout -->
    <div class="volume-pop-wrap" data-controller="volumepop"
         data-action="click@window->volumepop#close">
        <button type="button" class="btn btn-primary btn-media-control volume-btn"
                data-action="click->volumepop#toggle:stop" title="Speaker volume">
            <i data-volumepop-target="icon" class="mdi mdi-volume-high"></i>
        </button>
        <div data-volumepop-target="panel" class="volume-pop hidden">
            <input type="range" min="0" max="100" value="0" class="volume-pop-slider"
                   data-volumepop-target="slider" data-action="input->volumepop#setVolume" aria-label="Speaker volume">
            <div class="volume-pop-meta">
                <small data-volumepop-target="readout" class="device-meta">—</small>
                <button type="button" class="device-link-pill link-action" data-action="click->volumepop#toggleMute" title="Mute">
                    <i class="mdi mdi-volume-mute"></i>
                </button>
            </div>
            <small class="text-muted d-block device-meta" style="max-width: 4rem;">Speaker volume</small>
        </div>
    </div>

</div>FIN
echo "controls updated"
