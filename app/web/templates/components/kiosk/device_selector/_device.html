{# Single device card partial #}
<div class="card h-100 list-card {{ 'active' if instance.status else '' }}" 
    
    data-action="click->device#switchDevice"
    data-device-device-backend-param="{{ instance.backend_type|e }}"
    data-device-device-id-param="{{ instance.device_name|e }}"
    style="cursor: pointer; transition: transform 0.1s ease-in-out;">
    
    <div class="card-body d-flex flex-column align-items-center justify-content-center text-center p-4">
        <i class="mdi {{ instance.icon }} device-icon" style="font-size: 2.5rem;"></i>
        
        <h5 class="mt-3 mb-1 text-truncate w-100">{{ instance.device_name|e }}</h5>

        <small class="text-muted text-uppercase fw-bold" style="font-size: 0.65rem; letter-spacing: 0.5px;">
            {{ instance.backend_type|e }}
        </small>

        <div class="mt-3">
            {% if instance.status %}
            <span class="badge rounded-pill bg-success px-3">
                <i class="mdi mdi-check-circle me-1"></i> Active
            </span>
            {% else %}
            <span class="badge rounded-pill bg-light text-muted border px-3">
                Tap to select
            </span>
            {% endif %}
        </div>
    </div>
</div>
