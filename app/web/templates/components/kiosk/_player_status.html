<!-- Kiosk Player Status Component -->
<!-- Album art + track info display in horizontal layout -->
<div class="container kiosk-player-status d-flex align-items-center justify-content-center h-100">

    <div class="flex-row d-flex flex-md-row flex-column w-100">

        <div data-nowplaying-target="cover" class="col-md-6 kiosk-album-art d-flex align-items-center justify-content-center d-none h-100">
            <img data-nowplaying-target="coverimg" src="" alt="Album Cover" class="h-100 object-fit-cover" />
        </div>

        <div data-nowplaying-target="nocover" class="col-md-6 kiosk-album-art d-flex align-items-center justify-content-center ">
            <div class="kiosk-no-cover d-flex align-items-center justify-content-center w-100">
                <i class="mdi mdi-music-off"></i>
            </div>
        </div>
        
        <div data-nowplaying-target="trackinfo" class="col-md-6 kiosk-track-details ">
            <div  class="">
                <h1 class="display-1" data-nowplaying-target="artist"></h1>
                <h3 data-nowplaying-target="title" class=""></h3>
                <h4 data-nowplaying-target="album" class=""></h4>
                <h5 data-nowplaying-target="tracknum" class=""></h5>
            </div>
        </div>
        
        <div data-nowplaying-target="notrackinfo" class="col-md-6 kiosk-track-details">
            <h1 class="display-1" class="">No Music Playing</h1>
            <h3  class="">Insert a card...</h3>
        </div>
    </div>    

    <div class="row kiosk-progress-container w-100 d-none">
        <div class="col-12 kiosk-progress-bar">
            <div id="kiosk-progress-fill" class="kiosk-progress-fill"></div>
        </div>
        <div id="kiosk-progress-time" class="kiosk-progress-time">0:00 / 0:00</div>
    </div>
</div>
