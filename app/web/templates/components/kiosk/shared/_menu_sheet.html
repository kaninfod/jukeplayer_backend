<div class="menu-sheet-head">
    <span class="fw-semibold">Menu</span>
    <button type="button" class="btn btn-sm btn-link text-muted p-0" data-action="click->menusheet#close" title="Close">×</button>
</div>

<div class="menu-sheet-links">
    <a href="/kiosk/library" class="kiosk-link-card" data-action="click->menusheet#navigate">
        <span class="icon-tile tile-cc flex-shrink-0"><i class="mdi mdi-folder-music"></i></span>
        <span class="kiosk-link-card-body flex-grow-1">
            <span class="kiosk-link-card-title d-block">Media Library</span>
            <span class="kiosk-link-card-sub d-block">Browse albums and artists</span>
        </span>
        <i class="mdi mdi-chevron-right"></i>
    </a>

    <a href="/kiosk/playlist" class="kiosk-link-card"
       data-navigation-url-value="/kiosk/playlist"
       data-action="click->menusheet#playlist">
        <span class="icon-tile tile-bt flex-shrink-0"><i class="mdi mdi-playlist-music"></i></span>
        <span class="kiosk-link-card-body flex-grow-1">
            <span class="kiosk-link-card-title d-block">Playlist</span>
            <span class="kiosk-link-card-sub d-block">Current queue</span>
        </span>
        <i class="mdi mdi-chevron-right"></i>
    </a>

    <a href="/kiosk/devices" class="kiosk-link-card" data-action="click->menusheet#navigate">
        <span class="icon-tile tile-audio flex-shrink-0"><i class="mdi mdi-speaker-multiple"></i></span>
        <span class="kiosk-link-card-body flex-grow-1">
            <span class="kiosk-link-card-title d-block">Speakers</span>
            <span class="kiosk-link-card-sub d-block">Choose output</span>
        </span>
        <i class="mdi mdi-chevron-right"></i>
    </a>
</div>
