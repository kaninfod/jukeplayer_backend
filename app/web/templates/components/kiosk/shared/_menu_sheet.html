<div class="menu-sheet-head">
    <span class="fw-semibold">Speakers</span>
    <button type="button" class="btn btn-sm btn-link text-muted p-0" data-action="click->menusheet#close" title="Close">×</button>
</div>
<div class="menu-sheet-speakers">
    {% for s in speakers %}
    <button type="button" class="menu-sheet-speaker {{ 'is-current' if s.is_default else '' }}"
            data-action="click->menusheet#switch" data-menusheet-speaker-param="{{ s.name }}">
        <i class="mdi mdi-speaker"></i>
        <span>{{ s.display_name or s.name }}</span>
        {% if s.is_default %}<span class="device-meta ms-auto">fallback</span>{% endif %}
    </button>
    {% endfor %}
</div>
<div class="menu-sheet-links">
    <a href="/kiosk/library" data-action="click->menusheet#navigate"><i class="mdi mdi-folder-music me-2"></i>Media Library</a>
    <a href="/kiosk/playlist" data-action="click->menusheet#navigate"><i class="mdi mdi-playlist-music me-2"></i>Playlist</a>
    <a href="/kiosk/devices" data-action="click->menusheet#navigate"><i class="mdi mdi-speaker-multiple me-2"></i>Output Devices</a>
</div>FIN
