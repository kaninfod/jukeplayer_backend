    <div id="device-grid" class="flex-grow-1 overflow-auto">
        {% if not albums %}
          <div class="text-center text-muted py-5">
              <i class="mdi mdi-speaker-off" style="font-size: 48px;"></i>
              <p class="mt-3">No albums found</p>
          </div>
          {% else %}
          <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-lg-4 g-3 m-0">
              {% for album in albums %}
                <div class="col">
                  {% include 'components/kiosk/media_library/_album.html' %}
                </div>
              {% endfor %}
          </div>
        {% endif %}

    </div>
