    <form data-controller="library-search" class="library-search"
          data-action="submit->library-search#submit">
        <input data-library-search-target="field" id="library-search-field"
               data-action="keydown.down->library-search#downKey keydown.esc->library-search#escapeKey"
               class="library-search-field" type="search" autocomplete="off"
               placeholder="Search artists… ⏎">
    </form>
    <div id="device-grid" class="flex-grow-1 overflow-auto">
        {% if not groups %}
          <div class="text-center text-muted py-5">
              <i class="mdi mdi-speaker-off" style="font-size: 48px;"></i>
              <p class="mt-3">No output devices found</p>
          </div>
          {% else %}
          <div class="card-grid" data-keyboard-cards=".card.device-card"
               data-keyboard-focus-up="#library-search-field">
              {% for g in groups %}
                  {% include 'components/kiosk/media_library/_group.html' %}
              {% endfor %}
          </div>
        {% endif %}

    </div>
