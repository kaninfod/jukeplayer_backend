<div class="kiosk-component-container h-100 d-flex flex-column">
    <div  class="mb-4 flex-shrink-0">
        <h3 class="kiosk-artist mb-2">
            <i class="mdi mdi-radio"></i> Clients registered on server
        </h3>
        <p class="text-muted">Select where playback should go</p>
    </div>
    
    <div id="device-grid" class="flex-grow-1 overflow-auto">
        {% if not clients %}
          <div class="text-center text-muted py-5">
              <i class="mdi mdi-speaker-off" style="font-size: 48px;"></i>
              <p class="mt-3">No output devices found</p>
          </div>
          {% else %}
          <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-lg-4 g-3 m-0">
              {% for client in clients %}
                <div class="col">
                  {% include 'components/kiosk/clients/_client.html' %}
                </div>
              {% endfor %}
          </div>
        {% endif %}

    </div>
    
    <div id="device-status" class="mt-auto pt-3"></div>
</div>
