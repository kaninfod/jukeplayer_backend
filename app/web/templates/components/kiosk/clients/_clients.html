{% if not clients %}
<div style="grid-column: 1 / -1;" class="text-center text-muted py-5">
    <i class="mdi mdi-speaker-off" style="font-size: 48px;"></i>
    <p class="mt-3">No output devices found</p>
</div>
{% else %}
<div class="container">
  <div class="gap-3 justify-content-left overflow-auto d-flex flex-row">
    {% for client in clients  %}
      <div class="col">
        <div class="card h-100 device-card" 
            >
            <div class="card-body d-flex flex-column align-items-center justify-content-center text-center p-4">
            <i class="mdi mdi-web device-icon"></i>
                <h5 class="mt-3 mb-0">{{ client.client_ip }}</h5>

            <small class="text-muted mt-1">{{ client.user_name }}</small>
            <small class="text-muted mt-1">{{ client.client_id }}</small>
            <small class="text-muted mt-1">{{ client.client_type }}</small>
            <small class="text-muted mt-1">{{ client.connected_at }}</small>


            </div>
        </div>
      </div>
    {% endfor %}
  </div>
</div>
{% endif %}
