<div class="card h-100 list-card" style="cursor: pointer; transition: transform 0.1s ease-in-out;">    
  <div class="card-body d-flex flex-column align-items-center justify-content-center text-center p-4">
        <i class="mdi mdi-web" style="font-size: 2.5rem;"></i>
        
        <h5 class="mt-3 mb-1 text-truncate w-100">{{ details.user_name|e }}</h5>
        
        <small class="text-muted text-uppercase fw-bold" style="font-size: 0.65rem; letter-spacing: 0.5px;">
            {{ details.client_type|e }}
        </small>
        <small class="text-muted text-uppercase fw-bold" style="font-size: 0.65rem; letter-spacing: 0.5px;">
            {{ details.client_ip|e }}
        </small>
        <small class="text-muted mt-1 d-block text-break" style="overflow-wrap: break-word;">
            {{ details.client_id|e }}
        </small>
        <small class="text-muted mt-1">{{ details.connected_at }}</small>
        <div class="mt-3">
            <span class="badge rounded-pill bg-success px-3">
                <i class="mdi mdi-check-circle me-1"></i> Active
            </span>
        </div>
    </div>
</div>
