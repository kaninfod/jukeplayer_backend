<!-- Kiosk Volume Bar Component (Right Sidebar) -->
<div class="align-items-center justify-content-center h-100">
     <div class="kiosk-volume-bar-track">
        <div data-nowplaying-target="volumefill" class="kiosk-volume-bar-fill" style="height: 0%;"></div>
        <div class="kiosk-volume-bar-icon">
            <i class="mdi mdi-volume-high"></i>
        </div>
        <div data-nowplaying-target="volumetext" class="kiosk-volume-bar-text">0%</div>
    </div>
</div>
