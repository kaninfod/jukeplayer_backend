<div class="kiosk-component-container h-100 d-flex flex-column p-4">
    <h3 class="kiosk-artist mb-2">Configure {{ client_name }}</h3>
    <div class="flex-grow-1 d-flex flex-column overflow-hidden">
        <textarea id="config_json" class="form-control flex-grow-1" rows="25" spellcheck="false"
                  style="font-family: monospace; font-size: 0.85rem;">{{ config_json }}</textarea>
        <div class="mt-2 d-flex gap-2">
            <button type="button" class="btn btn-primary" onclick="applyConfig('{{ client_id }}')">
                <i class="mdi mdi-content-save me-1"></i> Apply
            </button>
            <button type="button" class="btn btn-danger"
                    onclick="if (confirm('Reboot the device after applying?')) applyConfig('{{ client_id }}', true)">
                <i class="mdi mdi-restart me-1"></i> Apply + Reboot
            </button>
            <a href="/kiosk/clients" class="btn btn-outline-secondary ms-auto">← Back</a>
        </div>
    </div>
</div>

<script>
async function applyConfig(clientId, reboot = false) {
    const config = document.getElementById('config_json').value;
    try { JSON.parse(config); } catch (e) { alert('Invalid JSON: ' + e); return; }
    const resp = await fetch(`/kiosk/configure/${clientId}/apply${reboot ? '?reboot=true' : ''}`, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: config
    });
    if (!resp.ok) { alert('Apply failed: ' + await resp.text()); return; }
    window.location.href = '/kiosk/clients';
}
</script>
