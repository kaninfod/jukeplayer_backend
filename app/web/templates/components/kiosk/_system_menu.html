<!-- Kiosk System Menu Component -->
<div class="kiosk-component-container">
    <div class="mb-4">
        <h3 class="kiosk-artist mb-2">
            <i class="mdi mdi-cog"></i> System Settings
        </h3>
    </div>
    
    <!-- 2 rows × 3 columns grid -->
    <div class="kiosk-grid-3col">
        <!-- Row 1, Col 1 -->
        <div class="card h-100 system-action-card" data-action="click->playercontrols#reloadApp">
            <div class="card-body d-flex flex-column align-items-center justify-content-center text-center p-4">
                <i class="mdi mdi-information" style="font-size: 48px; color: #6c757d;"></i>
                <h5 class="mt-3 mb-0">Info</h5>
                <small class="text-muted">Reload App</small>
            </div>
        </div>
        
        <!-- Row 1, Col 2 -->
        <div class="card h-100 system-action-card" data-action="click->navigation#toggleFullscreen">
            <div class="card-body d-flex flex-column align-items-center justify-content-center text-center p-4">
                <i class="mdi mdi-information" style="font-size: 48px; color: #6c757d;"></i>
                <h5 class="mt-3 mb-0">Info</h5>
                <small class="text-muted">Toggle Fullscreen</small>
            </div>
        </div>
        
        <!-- Row 1, Col 3 -->
        <div href="/kiosk/clients" data-action="click->navigation#load" class="card h-100 system-action-card" >
            <div class="card-body d-flex flex-column align-items-center justify-content-center text-center p-4">
                <i class="mdi mdi-information" style="font-size: 48px; color: #6c757d;"></i>
                <h5 class="mt-3 mb-0">Show Clients</h5>
                <small class="text-muted">Shows clients registered on the server</small>
            </div>
        </div>
        
        <!-- Row 2, Col 1 -->
        <div class="card h-100 system-action-card" >
            <div class="card-body d-flex flex-column align-items-center justify-content-center text-center p-4">
                <i class="mdi mdi-information" style="font-size: 48px; color: #6c757d;"></i>
                <h5 class="mt-3 mb-0">Info</h5>
                <small class="text-muted">Coming soon</small>
            </div>
        </div>
        
        <!-- Row 2, Col 2 -->
        <div class="card h-100 system-action-card" >
            <div class="card-body d-flex flex-column align-items-center justify-content-center text-center p-4">
                <i class="mdi mdi-brightness-6" style="font-size: 48px; color: #6c757d;"></i>
                <h5 class="mt-3 mb-0">Display</h5>
                <small class="text-muted">Coming soon</small>
            </div>
        </div>
        
        <!-- Row 2, Col 3 -->
        <div class="card h-100 system-action-card" >
            <div class="card-body d-flex flex-column align-items-center justify-content-center text-center p-4">
                <i class="mdi mdi-information" style="font-size: 48px; color: #6c757d;"></i>
                <h5 class="mt-3 mb-0">Info</h5>
                <small class="text-muted">Coming soon</small>
            </div>
        </div>
    </div>
    
    <!-- Status message area -->
    <div id="system-status" class="mt-4"></div>
</div>
