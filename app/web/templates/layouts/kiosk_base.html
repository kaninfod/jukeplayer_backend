<!DOCTYPE html>
<html lang="en" class="kiosk-mode">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script type="importmap">
      {
        "imports": {
          "@hotwired/stimulus": "https://unpkg.com/@hotwired/stimulus/dist/stimulus.js"
        }
      }
    </script>
    
    <script type="module" src="{{ url_for('static', path='/js/main.js') }}"></script>
    <title>{% block title %}Jukeplayer{% endblock %}</title>
    <link rel="icon" href="data:,">
    {% include '_global_styles.html' %}
    <link rel="stylesheet" href="/static/css/mdi.css">
    <link rel="stylesheet" href="/static/css/kiosk.css">
    <link rel="stylesheet" href="/static/css/nfc-client-select.css">
    {% block head_extra %}{% endblock %}
</head>
<body class="" 
    data-controller="websocket navigation playercontrols device nowplaying" 
    data-action="
      ws:send@window->websocket#handleOutgoing
      nav:go@window->navigation#load
      nowplaying-update@window->nowplaying#handleExternalUpdate
      volume-change@window->nowplaying#updateVolume
      switch-device-response@window->nowplaying#updateDevice
      "
>


    <div class="vh-100 vw-100 d-flex flex-column overflow-hidden">
        
        <header class="flex-shrink-0">
            {% include 'components/kiosk/_status_bar.html' %}
        </header>
        
        <main class="flex-grow-1 d-flex flex-row overflow-hidden" style="min-height: 0;">
            
            <nav class="h-100 flex-shrink-0">
                {% include 'components/kiosk/_navigation.html' %}
            </nav>

            <section class="flex-grow-1 h-100 d-flex flex-column overflow-hidden" data-navigation-target="content">
                {% block kiosk_content %}{% endblock %}
            </section>
            
        </main>
        
        <footer class="flex-shrink-0">
            {% include 'components/kiosk/_controls.html' %}
        </footer>

    </div>



    <!-- Toast container for global notifications -->
    <div id="kiosk-toast-container" class="toast-container position-fixed bottom-0 end-0 p-3" style="z-index: 1080;"></div>
    
    <!-- Kiosk-specific JavaScript -->
    <script src="/static/js/kiosk-toast.js"></script>
    <!-- load htmx early so our new template fragments can use hx- attributes
         (harmless if the old loader is still in use) -->





    {% block scripts %}{% endblock %}
</body>
</html>
